name: Refresh data and publish

on:
  # When new NSE files are uploaded (or anything else changes on main)
  push:
    branches: [main]
  # Every day at 06:45 IST (01:15 UTC)
  schedule:
    - cron: "15 1 * * *"
  # Run by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Process uploads and refresh feeds
        env:
          ECOURTS_API_KEY: ${{ secrets.ECOURTS_API_KEY }}
        run: node scripts/build-data.mjs

      - name: Save updated data to the repository
        run: |
          git config user.name "spread-scout-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data incoming
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
